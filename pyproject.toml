[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "epmd"
version = "1.0.0"
description = "Erlang Port Mapper Daemon in Python/Asyncio"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Erlang Solutions Ltd and S2HC Sweden AB", email = "pyrlang@s2hc.com" },
    { name = "Dmytro Lytovchenko", email = "dmytro.lytovchenko@gmail.com" },
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]
keywords = ["erlang", "epmd", "asyncio", "distribution"]
# Decision 2 in .agents/00-plan.md of the Pyrlang workspace.
requires-python = ">=3.11"
# Standard library only.
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "black", "isort", "mypy"]

[project.urls]
Homepage = "http://pyrlang.readthedocs.io/"

[tool.setuptools]
packages = ["epmd"]

[tool.pytest.ini_options]
testpaths = ["test"]
asyncio_default_fixture_loop_scope = "function"

[tool.black]
target-version = ["py311"]

[tool.isort]
profile = "black"

[tool.mypy]
python_version = "3.11"
packages = ["epmd"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
